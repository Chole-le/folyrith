<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2eb" />
<title>绎笺 FOLYRITH · 写作工作台</title>
<meta name="description" content="绎笺 FOLYRITH 独立写作工作台：作品和章节、自动保存、手动版本、设定卡片和本地备份。" />
<style>
:root{color-scheme:light;--bg:#f5f2eb;--paper:#fffcf6;--panel:#eeeae1;--ink:#26302b;--mute:#7d837c;--line:#dcd8cd;--green:#344a3c;--accent:#8c6a49;--soft:#e7e2d6;--danger:#ae554b;--shadow:0 16px 45px #27302813}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;-webkit-font-smoothing:antialiased}body.dark{color-scheme:dark;--bg:#1a211e;--paper:#222c27;--panel:#28332e;--ink:#e9ece4;--mute:#b0b9b0;--line:#3b4940;--green:#8ba78c;--accent:#d4ae81;--soft:#313d34;--danger:#e78b7a;--shadow:0 18px 50px #0004}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:0}a{color:inherit}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:0 24px;background:var(--paper)}.brand{display:flex;align-items:baseline;gap:10px;min-width:0}.brandmark{font-family:"Songti SC",Georgia,serif;font-size:28px;letter-spacing:.08em;white-space:nowrap}.brandeng{font-family:Georgia,serif;font-size:12px;letter-spacing:.23em;color:var(--mute)}.tinylabel{font-size:10px;color:var(--accent);letter-spacing:.05em;border:1px solid var(--line);padding:4px 6px;border-radius:4px;white-space:nowrap}.topact{display:flex;gap:7px;align-items:center}.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;line-height:1.2;font-size:13px;white-space:nowrap}.btn:hover{background:var(--soft)}.btn.primary{background:var(--green);color:var(--paper);border-color:var(--green)}body.dark .btn.primary{background:#89a58b;color:#132018;border-color:#89a58b}.btn.danger{color:var(--danger)}.btn.compact{padding:7px 9px}.btn.ghost{border-color:transparent}.status{font-size:12px;color:var(--mute);white-space:nowrap}.status.error{color:var(--danger)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 280px;height:calc(100dvh - 68px);min-height:460px}.sidebar{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}.sidehead{padding:23px 19px 16px;border-bottom:1px solid var(--line)}.eyebrow{letter-spacing:.18em;font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:650}.sproject{display:flex;align-items:center;gap:5px;margin-top:12px}.project-select{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-weight:600;font-size:14px;padding:11px 12px}.section-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:23px 18px 10px}.section-row h2{font-size:12px;color:var(--mute);font-weight:600;margin:0;letter-spacing:.08em}.chapterlist{padding:5px 10px;overflow:auto;flex:1;min-height:0}.chapter{width:100%;display:flex;align-items:center;gap:7px;color:var(--ink);text-align:left;background:transparent;padding:12px 12px;border-radius:8px;position:relative;border:1px solid transparent}.chapter.active{background:var(--paper);border-color:var(--line);box-shadow:0 3px 12px #202e2010}.chapter:hover{background:var(--soft)}.chaptermeta{min-width:0;flex:1}.chaptertitle{font-size:14px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chaptercount{font-size:11px;color:var(--mute);margin-top:7px;display:block}.chapternum{font-family:Georgia,serif;font-size:13px;color:var(--accent);width:23px;flex-shrink:0}.sidefoot{border-top:1px solid var(--line);padding:14px 17px 20px}.sidebar-tools{display:flex;gap:7px;margin:12px 0}.sidebar-tools .btn{flex:1;padding:9px 8px;font-size:12px}.sidefoot small{display:block;color:var(--mute);line-height:1.7;font-size:11px}.sidestats{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.workspace{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0}.workhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:22px 30px 17px;border-bottom:1px solid var(--line)}.workhead h1{font-size:22px;font-weight:570;margin:5px 0 0;font-family:"Songti SC",Georgia,serif}.workactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.editor-wrap{flex:1;overflow:auto;min-height:0;padding:42px clamp(22px,6vw,96px) 35px}.editor-card{max-width:810px;margin:auto;min-height:100%;padding-bottom:30px}.edit-title{display:block;width:100%;border:0;background:transparent;color:var(--ink);outline:none;font-size:clamp(29px,3vw,38px);font-family:"Songti SC",Georgia,serif;font-weight:600;padding:8px 0 17px;border-bottom:1px solid var(--line)}.chapterinfo{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:12px;margin:16px 0 34px}.editor{resize:none;border:0;outline:none;width:100%;min-height:460px;background:transparent;color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;line-height:2.05;font-size:19px;letter-spacing:.025em;padding:0 0 200px;display:block}.editor::placeholder{color:var(--mute);opacity:.7}.editor:focus,.edit-title:focus{outline:none}.workfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:11px 26px;background:var(--paper);font-size:12px;color:var(--mute);min-height:45px}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);min-height:0}.right-top{padding:25px 20px 15px;border-bottom:1px solid var(--line)}.right-top h2{font-family:"Songti SC",Georgia,serif;font-size:19px;font-weight:550;margin:7px 0 11px}.right-body{overflow:auto;padding:12px 13px;flex:1}.note{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--bg);margin-bottom:10px}.notetop{display:flex;justify-content:space-between;align-items:center;gap:10px}.note-title{font-weight:600;font-size:13px}.pill{font-size:10px;color:var(--accent);background:var(--soft);padding:5px 7px;border-radius:5px;white-space:nowrap}.note p{font-size:12px;color:var(--mute);white-space:pre-wrap;word-break:break-word;line-height:1.75;max-height:110px;overflow:hidden}.noteact{display:flex;gap:5px}.notefilter{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.chip{padding:6px 9px;background:var(--soft);border:0;border-radius:6px;font-size:11px;color:var(--mute)}.chip.active{background:var(--green);color:var(--paper)}body.dark .chip.active{background:#89a58b;color:#132018}.empty{padding:40px 18px;text-align:center;color:var(--mute);font-size:13px;line-height:2.1}.notice{font-size:11px;color:var(--mute);padding:16px;border-top:1px solid var(--line);line-height:1.75}.notice strong{color:var(--accent)}
.mobile-menu{display:none}.shade{display:none}.modal-shade{position:fixed;inset:0;background:#10191399;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal{background:var(--paper);color:var(--ink);max-height:min(92dvh,900px);overflow:auto;width:min(560px,100%);border-radius:15px;padding:25px;box-shadow:var(--shadow)}.modal.big{width:min(700px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.modal h2{font-family:"Songti SC",Georgia,serif;font-size:22px;margin:3px 0 22px}.field{display:flex;flex-direction:column;gap:8px;margin:16px 0}.field label{color:var(--mute);font-size:12px}.field input,.field textarea,.field select{background:var(--bg);color:var(--ink);padding:12px 13px;border:1px solid var(--line);border-radius:7px;max-width:100%}.field textarea{min-height:115px;resize:vertical;line-height:1.6}.modalact{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}.version{padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line)}.version strong{font-size:13px}.version p{font-size:12px;color:var(--mute);margin:4px 0}.searchresults{max-height:320px;overflow:auto;margin-top:16px}.searchresult{border:1px solid var(--line);padding:12px;border-radius:8px;margin-bottom:7px;cursor:pointer}.searchresult:hover{background:var(--soft)}.searchresult b{font-size:13px}.searchresult p{margin:6px 0 0;font-size:12px;color:var(--mute);line-height:1.6}.msg{font-size:12px;color:var(--mute);line-height:1.8} .hidden{display:none!important}
body.focus .sidebar,body.focus .right{display:none}body.focus .layout{grid-template-columns:minmax(0,1fr)}body.focus .workhead{padding-left:clamp(20px,18vw,260px);padding-right:clamp(20px,18vw,260px)}body.focus .workactions button:not([data-action="focus"]){display:none}
@media(max-width:1140px){.layout{grid-template-columns:245px minmax(0,1fr) 0}.right{display:none}.workhead{padding:16px 20px}.editor-wrap{padding:29px clamp(24px,7vw,80px)}.editor{font-size:18px}}
@media(max-width:720px){.top{height:60px;padding:0 13px;gap:8px}.brandmark{font-size:24px}.brandeng{font-size:10px;letter-spacing:.15em}.tinylabel{display:none}.topact .status{display:none}.topact button[data-action="backup"],.topact button[data-action="theme"]{display:none}.layout{height:calc(100dvh - 60px);grid-template-columns:minmax(0,1fr)}.mobile-menu{display:inline-flex}.sidebar{position:fixed;top:60px;bottom:0;left:0;width:min(310px,86vw);z-index:18;box-shadow:var(--shadow);transform:translateX(-110%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.shade.open{position:fixed;inset:60px 0 0;display:block;background:#17201866;z-index:17}.workhead{align-items:flex-start;gap:12px;padding:14px 18px;flex-direction:column}.workhead h1{font-size:19px}.workactions{justify-content:flex-start}.workactions .btn{font-size:12px;padding:7px 9px}.editor-wrap{padding:18px 23px}.edit-title{font-size:29px}.editor{font-size:18px;min-height:440px;line-height:1.95}.workfoot{padding:9px 16px}.status{font-size:11px}body.focus .workhead{padding:14px 18px}.right{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><button class="btn compact mobile-menu" data-action="menu" aria-label="打开章节目录">☰</button><span class="brandmark">绎笺</span><span class="brandeng">FOLYRITH</span><span class="tinylabel">独立写作版 · 本地存储</span></div><div class="topact"><span class="status" id="top-status">正在读取本地数据…</span><button class="btn" data-action="theme">◐</button><button class="btn" data-action="backup">导出备份</button><button class="btn primary" data-action="new-project">＋ 新作品</button></div></header>
<div class="shade" id="shade" data-action="close-menu"></div>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="sidehead"><div class="eyebrow">Your library · 作品书架</div><div class="sproject"><select aria-label="切换作品" class="project-select" id="project-select"></select><button class="btn compact" title="编辑作品信息" data-action="project-settings">···</button></div></div><div class="section-row"><h2>章节目录</h2><button class="btn compact" data-action="new-chapter">＋ 新章节</button></div><div id="chapterlist" class="chapterlist"></div><div class="sidefoot"><div class="sidestats"><span id="book-stats">0 章 · 0 字</span><span id="project-updated">—</span></div><div class="sidebar-tools"><button class="btn" data-action="backup">备份与导出</button><button class="btn" data-action="theme">切换配色</button></div><small>所有正文默认只存储在当前浏览器。请定期导出 JSON 备份，避免浏览器清理数据造成损失。</small></div></aside>
<main class="workspace"><div class="workhead"><div><div class="eyebrow" id="work-overline">MANUSCRIPT · 正文</div><h1 id="bookname">我的作品</h1></div><div class="workactions"><button class="btn" data-action="rename-chapter">章节设置</button><button class="btn" data-action="versions">历史版本</button><button class="btn" data-action="search">全书搜索</button><button class="btn" data-action="show-notes">设定卡</button><button class="btn" data-action="focus">专注模式</button></div></div><div class="editor-wrap"><div class="editor-card"><input class="edit-title" aria-label="章节标题" id="chapter-title" placeholder="章节标题" autocomplete="off" maxlength="150" /><div class="chapterinfo"><span id="chapter-label">第一章</span><span>•</span><span id="chapter-word">0 字</span><span>•</span><span id="saved-time">尚未保存</span></div><textarea id="chapter-body" class="editor" spellcheck="false" aria-label="章节正文" placeholder="从这里开始，让第一句话出现。\n\n正文会在输入后自动保存到当前浏览器。" ></textarea></div></div><footer class="workfoot"><span>绎笺 FOLYRITH · 写作不必打断思路</span><span id="footer-count">本章 0 字 · 全书 0 字</span></footer></main>
<aside class="right" id="right"><div class="right-top"><div class="eyebrow">Continuity & sources</div><h2>人物 · 世界 · 依据</h2><button class="btn primary" data-action="add-note">＋ 添加设定卡</button><div class="notefilter"><button class="chip active" data-filter="全部">全部</button><button class="chip" data-filter="人物">人物</button><button class="chip" data-filter="世界">世界</button><button class="chip" data-filter="史料">史料</button><button class="chip" data-filter="待核">待核</button></div></div><div class="right-body" id="notes-list"></div><div class="notice"><strong>说明：</strong>设定卡和来源是作者手动管理的记录。标记“有来源”不表示史实已被系统证实。</div></aside>
</div>
<div id="modal-root"></div><input id="import-file" type="file" class="hidden" accept=".json,application/json" />
<script>
/* FOLYRITH standalone independent implementation, 2026. No upstream InkFlow, NextChat or StyleSync source reused. */
(()=>{'use strict';
const KEY='folyrith:standalone:v1', uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const $=s=>document.querySelector(s), html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count=s=>(String(s??'').match(/[^\s\u200b]/g)||[]).length;
const now=()=>new Date().toISOString(), time=s=>{if(!s)return '—';try{return new Date(s).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return '—'}};
const newChapter=(title='第一章')=>({id:uid(),title,body:'',createdAt:now(),updatedAt:now(),versions:[]});
const newProject=(title='未命名作品')=>({id:uid(),title,description:'',createdAt:now(),updatedAt:now(),chapters:[newChapter()],notes:[]});
const initial=()=>{let p=newProject();return{schema:1,projects:[p],activeProjectId:p.id,activeChapterId:p.chapters[0].id,theme:'light'}};
let state,storageUsable=true,filter='全部',mobileNotes=false,editingNoteId=null;
try{let raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):initial();if(!Array.isArray(state.projects))throw Error('Invalid saved data');localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageUsable=false;state=initial()}
const proj=()=>state.projects.find(p=>p.id===state.activeProjectId)||state.projects[0],chap=()=>proj()?.chapters?.find(c=>c.id===state.activeChapterId)||proj()?.chapters?.[0];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageUsable=true;$('#top-status').textContent='● 已保存到当前浏览器';$('#top-status').classList.remove('error');return true}catch(e){storageUsable=false;$('#top-status').textContent='⚠ 无法写入本地存储，请立即导出备份';$('#top-status').classList.add('error');return false}}
function changed(){let p=proj(),c=chap();if(p)p.updatedAt=now();if(c)c.updatedAt=now();persist();updateStats()}
function render(){if(!state.projects.length){let p=newProject();state.projects=[p];state.activeProjectId=p.id;state.activeChapterId=p.chapters[0].id}
 let p=proj();if(!p?.chapters?.length)p.chapters=[newChapter()];state.activeProjectId=p.id;let c=chap();state.activeChapterId=c.id;
 $('#project-select').innerHTML=state.projects.map(x=>`<option value="${html(x.id)}" ${x.id===p.id?'selected':''}>${html(x.title)}</option>`).join('');
 $('#chapterlist').innerHTML=p.chapters.map((x,i)=>`<button class="chapter ${x.id===c.id?'active':''}" data-chapter="${html(x.id)}"><span class="chapternum">${String(i+1).padStart(2,'0')}</span><span class="chaptermeta"><span class="chaptertitle">${html(x.title)}</span><span class="chaptercount">${count(x.body).toLocaleString()} 字 · ${time(x.updatedAt)}</span></span></button>`).join('');
 $('#bookname').textContent=p.title;$('#chapter-title').value=c.title;$('#chapter-body').value=c.body;$('#chapter-label').textContent=`第 ${p.chapters.indexOf(c)+1} 章`;$('#saved-time').textContent='编辑内容将自动保存';
 document.body.classList.toggle('dark',state.theme==='dark');renderNotes();updateStats();persist()}
function updateStats(){let p=proj(),c=chap();if(!p||!c)return;let total=p.chapters.reduce((a,x)=>a+count(x.body),0);$('#chapter-word').textContent=count(c.body).toLocaleString()+' 字';$('#book-stats').textContent=p.chapters.length+' 章 · '+total.toLocaleString()+' 字';$('#footer-count').textContent='本章 '+count(c.body).toLocaleString()+' 字 · 全书 '+total.toLocaleString()+' 字';$('#project-updated').textContent=time(p.updatedAt);$('#saved-time').textContent=storageUsable?'已保存在此浏览器':'保存失败，请导出备份'}
function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}
function notesView(){if(window.innerWidth>1140){mobileNotes=false;return}mobileNotes=true;openModal('设定与史料',`<div style="margin-bottom:12px"><button class="btn primary" data-action="add-note">＋ 添加设定卡</button></div><div id="modal-notes"></div>`,true);renderNotes()}
function renderNotes(){let p=proj();let notes=p.notes||[];let show=notes.filter(n=>filter==='全部'||n.category===filter);
let body=show.length?show.map(n=>`<article class="note"><div class="notetop"><span class="note-title">${html(n.title)}</span><span class="pill">${html(n.category)}</span></div><p>${html(n.detail)}</p>${n.source?`<p style="border-left:2px solid var(--accent);padding-left:9px">依据：${html(n.source)}</p>`:''}<div class="notetop"><span class="pill">${html(n.status||'待整理')}</span><span class="noteact"><button class="btn compact" data-action="edit-note" data-id="${html(n.id)}">编辑</button><button class="btn compact danger" data-action="delete-note" data-id="${html(n.id)}">删除</button></span></div></article>`).join(''):'<div class="empty">还没有这类设定卡。<br>可以记录人物关系、世界规则、史料线索和待核问题。</div>';
 $('#notes-list').innerHTML=body;let m=$('#modal-notes');if(m)m.innerHTML=body;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter===filter))}
function openModal(title,body,big=false){$('#modal-root').innerHTML=`<div class="modal-shade" role="presentation" id="modal-shade"><section class="modal ${big?'big':''}" role="dialog" aria-modal="true" aria-label="${html(title)}"><div class="modal-head"><div><div class="eyebrow">FOLYRITH STUDIO</div><h2>${html(title)}</h2></div><button class="btn compact" data-action="close-modal">✕</button></div>${body}</section></div>`}
function closeModal(){$('#modal-root').innerHTML='';editingNoteId=null}
function editProject(){let p=proj();openModal('作品设置',`<div class="field"><label for="pname">作品名称</label><input id="pname" maxlength="150" value="${html(p.title)}" /></div><div class="field"><label for="pdesc">简介 / 备注</label><textarea id="pdesc">${html(p.description||'')}</textarea></div><div class="modalact"><button class="btn danger" data-action="delete-project">删除作品</button><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-project">保存修改</button></div>`)}
function chapterSettings(){let p=proj(),c=chap(),i=p.chapters.indexOf(c);openModal('章节设置',`<p class="msg">当前 ${i+1} / ${p.chapters.length} 章 · ${count(c.body)} 字</p><div class="modalact" style="justify-content:flex-start"><button class="btn" data-action="move-up" ${i===0?'disabled':''}>↑ 上移</button><button class="btn" data-action="move-down" ${i===p.chapters.length-1?'disabled':''}>↓ 下移</button><button class="btn danger" data-action="delete-chapter">删除本章</button></div><p class="msg">修改章名请直接编辑正文上方的标题栏。删除操作无法撤销，请先导出备份。</p>`)}
function snapshot(label='手动保存'){let c=chap();if(!c)return;let v={id:uid(),label,title:c.title,body:c.body,at:now()};c.versions=Array.isArray(c.versions)?c.versions:[];c.versions.unshift(v);c.versions=c.versions.slice(0,30);changed()}
function versions(){let c=chap();let vv=c.versions||[];openModal('章节历史版本',`<p class="msg">仅保留最近 30 个手动版本。正在编辑的正文另行自动保存，版本恢复前将自动为当前内容创建一份快照。</p><div class="modalact" style="justify-content:flex-start"><button class="btn primary" data-action="snapshot">＋ 保存当前版本</button></div><div id="version-list">${vv.length?vv.map(v=>`<div class="version"><div><strong>${html(v.label)}</strong><p>${time(v.at)} · ${count(v.body)} 字</p></div><button class="btn" data-action="restore" data-id="${html(v.id)}">恢复此版本</button></div>`).join(''):'<p class="empty">还没有保存手动版本。</p>'}</div>`)}
function noteForm(id){let p=proj(),n=p.notes.find(x=>x.id===id)||{title:'',category:'人物',detail:'',source:'',status:'待整理'};editingNoteId=id||null;openModal(id?'编辑设定卡':'新建设定卡',`<div class="field"><label>标题</label><input id="n-title" maxlength="120" placeholder="例如：阿锦 / 吴江县平望镇 / 婚姻诉讼" value="${html(n.title)}" /></div><div class="field"><label>类别</label><select id="n-category">${['人物','世界','史料','待核'].map(x=>`<option ${x===n.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>内容</label><textarea id="n-detail" placeholder="人物关系、重要设定、时间线、事件背景…">${html(n.detail)}</textarea></div><div class="field"><label>依据 / 来源（可留空；由作者自行核验）</label><textarea id="n-source" placeholder="书目、页码、资料摘录或参考链接…">${html(n.source)}</textarea></div><div class="field"><label>核查状态</label><select id="n-status">${['待整理','需要核查','有来源待核','作者已核查'].map(x=>`<option ${x===n.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="modalact"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-note">保存设定</button></div>`)}
function fullSearch(){openModal('全书搜索',`<div class="field"><label>在当前作品的所有章节里查找关键词</label><input id="searchq" placeholder="输入人物、地点或事件…" autocomplete="off" /></div><div id="searchresults" class="searchresults"><p class="empty">输入关键词后显示搜索结果。</p></div>`,true);$('#searchq').focus()}
function doSearch(q){let root=$('#searchresults');if(!root)return;let term=q.trim();if(!term){root.innerHTML='<p class="empty">输入关键词后显示搜索结果。</p>';return}let found=[];proj().chapters.forEach(c=>{let hay=c.title+'\n'+c.body,idx=-1,start=0,n=0;while((idx=hay.toLocaleLowerCase().indexOf(term.toLocaleLowerCase(),start))!==-1&&n<8){found.push({chapterId:c.id,title:c.title,snippet:hay.slice(Math.max(0,idx-50),Math.min(hay.length,idx+term.length+75))});n++;start=idx+Math.max(1,term.length)}});root.innerHTML=found.length?found.slice(0,70).map((x,i)=>`<div class="searchresult" role="button" tabindex="0" data-search-result="${html(x.chapterId)}"><b>${html(x.title)}</b><p>${html(x.snippet)}</p></div>`).join(''):'<p class="empty">没有找到匹配内容。</p>'}
function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function safeFilename(t){return String(t).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,64)||'untitled'}
function backup(){const data={format:'folyrith-standalone',version:1,exportedAt:now(),projects:state.projects};download('FOLYRITH_全部作品备份_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}))}
function textExport(){let p=proj(),text=p.chapters.map((c,i)=>`${c.title}\n\n${c.body}`).join('\n\n────────────────────────\n\n');download(safeFilename(p.title)+'.txt',new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}))}
function backupMenu(){openModal('备份 · 导入 · 导出',`<p class="msg">当前版本只保存在这个设备、这个浏览器对应的网址存储中，不会自动云端同步。请养成定期备份的习惯。</p><div class="modalact" style="justify-content:flex-start"><button class="btn primary" data-action="backup-now">下载全部作品 JSON 备份</button><button class="btn" data-action="export-txt">导出当前作品 TXT</button><button class="btn" data-action="import">导入本站 JSON 备份</button></div><p class="msg">导入会增加新作品，不会覆盖当前作品。此独立版不兼容原 React 工作台的 JSON 格式；请勿用它直接迁移原项目数据。</p>`)}
function normalizeImported(data){if(data?.format!=='folyrith-standalone'||data?.version!==1||!Array.isArray(data.projects))throw Error('文件不是此独立版导出的 JSON 备份');if(data.projects.length>100)throw Error('作品数量异常');return data.projects.map(p=>{if(typeof p.title!=='string'||!Array.isArray(p.chapters)||p.chapters.length>3000||!p.chapters.length)throw Error('作品或章节数据不完整');let id=uid(),ids={};let chapters=p.chapters.map(c=>{if(typeof c.title!=='string'||typeof c.body!=='string'||c.body.length>4000000)throw Error('章节正文格式不符合要求');let cid=uid();ids[c.id]=cid;return{id:cid,title:c.title.slice(0,150),body:c.body,createdAt:now(),updatedAt:now(),versions:Array.isArray(c.versions)?c.versions.slice(0,30).filter(v=>typeof v.body==='string'&&typeof v.title==='string').map(v=>({id:uid(),title:v.title,body:v.body,label:String(v.label||'导入版本'),at:v.at||now()})):[]}});let notes=Array.isArray(p.notes)?p.notes.slice(0,3000).map(n=>({id:uid(),title:String(n.title||'').slice(0,120),category:['人物','世界','史料','待核'].includes(n.category)?n.category:'待核',detail:String(n.detail||''),source:String(n.source||''),status:String(n.status||'待整理'),chapterId:ids[n.chapterId]||null})):[];return{id,title:p.title.slice(0,150),description:String(p.description||''),createdAt:now(),updatedAt:now(),chapters,notes}})}
$('#chapter-title').addEventListener('input',e=>{let c=chap();if(!c)return;c.title=e.target.value;changed();$('#chapterlist .chapter.active .chaptertitle').textContent=c.title||'（未命名章节）'});
$('#chapter-body').addEventListener('input',e=>{let c=chap();if(!c)return;c.body=e.target.value;changed();let a=$('#chapterlist .chapter.active .chaptercount');if(a)a.textContent=count(c.body).toLocaleString()+' 字 · '+time(c.updatedAt)});
$('#project-select').addEventListener('change',e=>{state.activeProjectId=e.target.value;state.activeChapterId=proj().chapters[0]?.id;closeMenu();render()});
document.addEventListener('input',e=>{if(e.target.id==='searchq')doSearch(e.target.value)});
$('#import-file').addEventListener('change',async e=>{let f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>40*1024*1024)throw Error('文件过大（限制 40MB）');let data=JSON.parse(await f.text()),pp=normalizeImported(data);if(!pp.length)throw Error('备份文件中没有作品');if(!confirm(`将额外导入 ${pp.length} 部作品。不会覆盖现有作品。继续？`))return;state.projects.push(...pp);state.activeProjectId=pp[0].id;state.activeChapterId=pp[0].chapters[0].id;persist();closeModal();render();alert(`已导入 ${pp.length} 部作品。请检查内容后再编辑。`)}catch(err){alert('导入失败：'+err.message)}});
document.addEventListener('click',e=>{let fl=e.target.closest('[data-filter]');if(fl){filter=fl.dataset.filter;renderNotes();return}
let cb=e.target.closest('[data-chapter]');if(cb){state.activeChapterId=cb.dataset.chapter;render();closeMenu();return}
let sr=e.target.closest('[data-search-result]');if(sr){state.activeChapterId=sr.dataset.searchResult;closeModal();render();return}
let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;
switch(action){case'menu':$('#sidebar').classList.add('open');$('#shade').classList.add('open');break;
case'close-menu':closeMenu();break;
case'new-project':{let title=prompt('新作品叫什么名字？','我的新小说');if(title===null)return;let p=newProject(title.trim()||'未命名作品');state.projects.push(p);state.activeProjectId=p.id;state.activeChapterId=p.chapters[0].id;render();closeMenu();break}
case'project-settings':editProject();break;
case'save-project':{let p=proj();p.title=$('#pname').value.trim()||'未命名作品';p.description=$('#pdesc').value;changed();closeModal();render();break}
case'delete-project':{if(state.projects.length===1){alert('至少保留一部作品。如需清空，可以删除章节内容。');return}let p=proj();if(!confirm(`永久删除「${p.title}」及全部章节、设定和版本？此操作不可撤销。`))return;state.projects=state.projects.filter(x=>x.id!==p.id);state.activeProjectId=state.projects[0].id;state.activeChapterId=state.projects[0].chapters[0].id;closeModal();render();break}
case'new-chapter':{let p=proj();let n=p.chapters.length+1;let title=prompt('新章节名称',`第${n}章`);if(title===null)return;let c=newChapter(title.trim()||`第${n}章`);p.chapters.push(c);state.activeChapterId=c.id;render();closeMenu();$('#chapter-body').focus();break}
case'rename-chapter':chapterSettings();break;
case'delete-chapter':{let p=proj(),c=chap();if(p.chapters.length<=1){alert('至少需要保留一章。');return}if(!confirm(`确定删除「${c.title}」及其历史版本？删除后不能恢复。`))return;p.chapters=p.chapters.filter(x=>x.id!==c.id);state.activeChapterId=p.chapters[0].id;closeModal();render();break}
case'move-up':case'move-down':{let p=proj(),i=p.chapters.indexOf(chap()),j=i+(action==='move-up'?-1:1);if(j<0||j>=p.chapters.length)return;[p.chapters[i],p.chapters[j]]=[p.chapters[j],p.chapters[i]];closeModal();changed();render();break}
case'versions':versions();break;
case'snapshot':snapshot();versions();break;
case'restore':{let c=chap(),v=(c.versions||[]).find(x=>x.id===b.dataset.id);if(!v)return;if(!confirm(`恢复 ${time(v.at)} 的版本？当前内容会先自动建立快照。`))return;snapshot('恢复前自动备份');c.body=v.body;c.title=v.title;changed();closeModal();render();break}
case'search':fullSearch();break;
case'show-notes':notesView();break;
case'add-note':noteForm();break;
case'edit-note':noteForm(b.dataset.id);break;
case'delete-note':{let p=proj(),n=p.notes.find(n=>n.id===b.dataset.id);if(!n)return;if(!confirm(`删除设定卡「${n.title}」？`))return;p.notes=p.notes.filter(x=>x.id!==n.id);changed();renderNotes();break}
case'save-note':{let title=$('#n-title').value.trim();if(!title){alert('请填写设定卡标题');return}let p=proj(),n=editingNoteId?p.notes.find(x=>x.id===editingNoteId):null;if(!n){n={id:uid()};p.notes.push(n)}n.title=title;n.category=$('#n-category').value;n.detail=$('#n-detail').value;n.source=$('#n-source').value;n.status=$('#n-status').value;n.updatedAt=now();changed();closeModal();renderNotes();break}
case'focus':{document.body.classList.toggle('focus');b.textContent=document.body.classList.contains('focus')?'退出专注':'专注模式';break}
case'theme':{state.theme=state.theme==='dark'?'light':'dark';persist();render();break}
case'backup':backupMenu();break;
case'backup-now':backup();break;
case'export-txt':textExport();break;
case'import':$('#import-file').click();break;
case'close-modal':closeModal();break;
}}
);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();snapshot('快捷键手动版本');$('#saved-time').textContent='已建立手动版本'}});
if(!storageUsable)$('#top-status').textContent='⚠ 浏览器本地存储不可用';render();
})();
</script>
</body>
</html>
